   name: build
   on: [push, pull_request]
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: leanprover/lean-action@v1
         - name: Check axioms
           run: |
             lake env lean scripts/CheckAxioms.lean | tee axioms.txt
             ! grep -E "sorryAx|ofReduceBool" axioms.txt